# SAMPLE DATA — a fictional cohort member, for demonstrating the dashboard.
# Not a real person; not anyone's real numbers.
#
# Shows every cadence: daily (walks, low-carb, writing minutes), weekly
# (applications, Zone 2, sugary drinks as a "no more than"), every two weeks
# (coffee chats), and monthly (portfolio refresh, Weeks 1–4, 5–8, …). Outcomes
# get a reading each week in the logs, so the dashboard can show the trend.
person: Sample Member
cohort: LV236
day_one: 2026-08-24
length_days: 100
timezone: America/Chicago
checkpoints: [30, 60, 90]
deload_weeks: [8, 12]

goals:
  - id: body
    number: 1
    kind: Personal
    area: Body
    title: Walk after meals, eat low-carb, build an engine
    process:
      - id: walks
        label: Walks after meals (0–2 a day)
        cadence: daily
        measure: count
        base: 10
        stretch: 14
      - id: low-carb
        label: Low-carb breakfast and lunch
        cadence: daily
        measure: check
        base: null
        stretch: null
        weeks:
          3: { base: 4, stretch: 5 }
          5: { base: 5, stretch: 6 }
      - id: zone2
        label: Zone 2 sessions (30 min)
        cadence: weekly
        measure: count
        base: null
        stretch: null
        weeks:
          5: { base: 2, stretch: 2 }
          7: { base: 2, stretch: 3 }
          8: { base: 1, stretch: 1 }
          9: { base: 2, stretch: 3 }
      - id: sugary-drinks
        label: Sugary drinks
        cadence: weekly
        measure: count
        direction: down
        stretch: 1
    outcomes:
      - id: weight
        label: Weight
        unit: lb
        direction: down
        baseline: { date: 2026-08-24, value: 210 }
        milestones: { 30: [203, 206], 60: [197, 201], 90: [191, 196] }

  - id: career
    number: 2
    kind: Personal
    area: Career
    title: Land a role I want by spring
    process:
      - id: applications
        label: Tailored applications
        cadence: weekly
        measure: count
        base: 3
        stretch: 5
      - id: coffee-chats
        label: Coffee chats (per two weeks)
        cadence: biweekly
        measure: count
        base: 2
        stretch: 4
      - id: portfolio
        label: Portfolio refresh (one a month)
        cadence: monthly
        measure: check
        base: 1
        stretch: 1
    outcomes:
      - id: interviews
        label: First-round interviews (cumulative)
        direction: up
        baseline: { date: 2026-08-24, value: 0 }
        milestones: { 30: [1, 2], 60: [3, 4], 90: [5, 7] }

  - id: writing
    number: 3
    kind: Creative
    area: Writing
    title: A finished draft of the book's first act
    process:
      - id: writing-min
        label: Writing (minutes)
        cadence: daily
        measure: minutes
        base: 90
        stretch: 150
    outcomes:
      - id: words
        label: Words drafted (cumulative)
        unit: k
        direction: up
        baseline: { date: 2026-08-24, value: 0 }
        milestones: { 30: [8, 10], 60: [18, 22], 90: [28, 34] }

  - id: people
    number: 4
    kind: Relationships
    area: People
    title: Be there for my family
    process:
      - id: family-call
        label: Call home
        cadence: weekly
        measure: check
        base: 1
        stretch: 1
      - id: date-night
        label: Date night
        cadence: weekly
        measure: check
        stretch: 1
    outcomes:
      - id: closeness
        label: How close we feel (0–10)
        direction: up
        baseline: { date: 2026-08-24, value: 5 }
        track_only: true
