# Michael Staton's PSP, as numbers. Source of truth for the plan itself:
# src/content/psp/personal-strategic-plan.md. Format and rules:
# hope-ai/references/dashboard-guidelines.md
#
# Floors and targets are per program week. `weeks:` overrides carry forward
# from that week on; they encode each goal's weekly action plan, including
# the Week 8 and Week 12 deloads.

person: Michael Staton
cohort: LV236
day_one: 2026-09-28
length_days: 100
timezone: America/Chicago
checkpoints: [30, 60, 90]
deload_weeks: [8, 12]

goals:
  # ── 1 ────────────────────────────────────────────────────────────────────
  - id: body
    number: 1
    kind: Personal
    area: Body
    title: Move first, move after meals, track everything
    process:
      - id: am-move
        label: Morning move
        cadence: daily
        measure: check
        floor: 7
        target: 7
      - id: hydration
        label: Hydration Day
        cadence: daily
        measure: check
        floor: 5
        target: 7
      - id: keto
        label: Keto until dinner
        cadence: daily
        measure: check
        floor: 5
        target: 7
      - id: chunks
        label: Movement chunks (0–3 a day)
        cadence: daily
        measure: count
        floor: 15
        target: 21
        weeks:
          8: { floor: 14 }
          9: { floor: 15 }
          12: { floor: 14 }
      - id: discomfort
        label: Chosen discomfort
        cadence: daily
        measure: check
        floor: 4
        target: 7
      - id: walk-in
        label: Gym walk-in
        cadence: daily
        measure: check
        note: Every day with gym access; a bonus, never a miss.
      - id: resistance
        label: Resistance sessions
        cadence: weekly
        measure: count
        floor: 2
        target: 4
        weeks:
          2: { floor: 3 }
          8: { floor: 2, target: 2 }
          9: { floor: 3, target: 4 }
          12: { floor: 2, target: 2 }
      - id: intervals
        label: Interval sessions (4x4, sprints)
        cadence: weekly
        measure: count
        floor: 1
        target: 1
        weeks:
          3: { floor: 2, target: 2 }
          6: { floor: 3, target: 3 }
          8: { floor: 1, target: 1 }
          9: { floor: 3, target: 3 }
          12: { floor: 1, target: 1 }
      - id: fast
        label: Weekly fast (36 h; Week 8 is the Sardine Fast)
        cadence: weekly
        measure: check
        floor: 1
        target: 1
      - id: carb-meals
        label: Carb meals
        cadence: weekly
        measure: count
        direction: down
        target: 4
    outcomes:
      - id: weight
        label: Weight
        unit: lb
        direction: down
        baseline: { date: 2026-09-28, value: 213 }
        milestones: {}
        note: Pace once the Day 0 reading and the GP's advice are in.
      - id: waist-height
        label: Waist-to-height ratio
        direction: down
        baseline: null
        milestones: {}
        note: Healthy/fit target is under 0.5.
      - id: resting-hr
        label: Resting heart rate
        unit: bpm
        direction: down
        baseline: null
        milestones: {}
        note: Healthy/fit target is under 60 bpm.
      - id: hba1c
        label: HbA1c (lab)
        unit: '%'
        direction: down
        baseline: null
        milestones: {}
        note: Labs at Day 0 and the end only. Target under 5.7%.

