<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-label="Claude">
  <title>Claude</title>
  <!-- Stylized asterisk/starburst evoking Anthropic's Claude mark.
       Eight tapered petals around a center point. -->
  <g>
    <ellipse cx="12" cy="4"  rx="1.1" ry="3.5"/>
    <ellipse cx="12" cy="20" rx="1.1" ry="3.5"/>
    <ellipse cx="4"  cy="12" rx="3.5" ry="1.1"/>
    <ellipse cx="20" cy="12" rx="3.5" ry="1.1"/>
    <ellipse cx="6.5"  cy="6.5"  rx="1"   ry="2.6" transform="rotate(-45 6.5 6.5)"/>
    <ellipse cx="17.5" cy="17.5" rx="1"   ry="2.6" transform="rotate(-45 17.5 17.5)"/>
    <ellipse cx="6.5"  cy="17.5" rx="1"   ry="2.6" transform="rotate(45 6.5 17.5)"/>
    <ellipse cx="17.5" cy="6.5"  rx="1"   ry="2.6" transform="rotate(45 17.5 6.5)"/>
  </g>
</svg>
